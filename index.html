    <title>Dapur 59 - Pre-Order Makanan</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Dapur 59 kamu
        const firebaseConfig = {
          apiKey: "AIzaSyAQBilqj580vJYJuAYAZk6jt9RKbFLJb3c",
          authDomain: "dapur59-47a5a.firebaseapp.com",
          projectId: "dapur59-47a5a",
          storageBucket: "dapur59-47a5a.firebasestorage.app",
          messagingSenderId: "658361629913",
          appId: "1:658361629913:web:b0ca8491bc6bd5bd6a52c8"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Contoh fungsi global untuk menyimpan pesanan ke Firestore
        window.kirimPesanan = async function(dataPesanan) {
            try {
                await addDoc(collection(db, "pesanan"), dataPesanan);
                alert("Pesanan berhasil dikirim ke Dapur 59!");
            } catch (e) {
                console.error("Gagal mengirim pesanan: ", e);
                alert("Terjadi kesalahan saat mengirim pesanan.");
            }
        };
    </script>
</head>
